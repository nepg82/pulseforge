<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12161f">
  <meta name="description" content="Procedural Electronic Music Generator PWA">
  <title>PulseForge Audio Synthesizer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon"></div>
        <h1>PULSEFORGE</h1>
      </div>
      <div class="global-controls">
        <button id="btn-play" class="btn-primary">START AUDIO</button>
        <button id="btn-radio" class="btn-radio">RADIO MODE: OFF</button>
      </div>
    </header>

    <main class="dashboard grid">
      <!-- Global Sound Controls -->
      <section class="card shadow">
        <h2>Global Configuration</h2>
        <div class="control-group">
          <label for="select-style">Style Spectrum</label>
          <select id="select-style">
            <option value="chillhop">Chillhop</option>
            <option value="synthwave" selected>Synthwave</option>
            <option value="darksynth">Darksynth</option>
            <option value="dubstep">Dubstep</option>
          </select>
        </div>

        <div class="control-group">
          <label for="select-key">Root Key</label>
          <select id="select-key">
            <option value="C">C</option>
            <option value="C#">C# / Db</option>
            <option value="D">D</option>
            <option value="D#">D# / Eb</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="F#">F# / Gb</option>
            <option value="G">G</option>
            <option value="G#">G# / Ab</option>
            <option value="A" selected>A</option>
            <option value="A#">A# / Bb</option>
            <option value="B">B</option>
          </select>
        </div>

        <div class="control-group">
          <label for="input-bpm">Tempo: <span id="val-bpm">110</span> BPM</label>
          <input type="range" id="input-bpm" min="60" max="180" value="110">
        </div>

        <div class="control-group">
          <label for="select-progression">Chord Progression</label>
          <select id="select-progression"></select>
        </div>

        <div class="control-group">
          <label for="input-variety">Variety Modulation: <span id="val-variety">30%</span></label>
          <input type="range" id="input-variety" min="0" max="100" value="30">
        </div>
      </section>

      <!-- Status Display -->
      <section class="card shadow status-card">
        <h2>Engine Status</h2>
        <div id="status-display" class="status-box">System Idle</div>
        <div class="track-info">
          <div><span>Current Mode:</span> <strong id="mode-text">Manual Loop</strong></div>
          <div><span>Active Bar:</span> <strong id="bar-counter">0</strong></div>
          <div><span>Active Key/BPM:</span> <strong id="active-params">A Minor @ 110 BPM</strong></div>
        </div>
      </section>

      <!-- Dynamic Instrument Rack -->
      <section class="card shadow full-width">
        <h2>Instrument Rack & Gain Controls</h2>
        <div id="rack-container" class="rack-grid"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker registered:', reg.scope))
          .catch(err => console.log('ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
