<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171428">
  <meta name="description" content="PulseForge — an offline electronic music playground.">
  <title>PulseForge</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./app-icons/app-icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div>
        <p class="eyebrow">GENERATIVE AUDIO</p>
        <h1>PulseForge</h1>
      </div>
      <div class="status" id="status" data-state="stopped">
        <span class="status-dot"></span>
        <span id="status-text">STOPPED</span>
      </div>
    </header>

    <section class="player-panel" aria-label="Audio player">
      <div class="track-info">
        <p class="eyebrow">CURRENT SESSION</p>
        <h2 id="track-title">First Light</h2>
        <p id="track-subtitle">A simple pulse, built to stay running.</p>
      </div>

      <div class="transport">
        <button class="transport-button secondary" id="previous-button" type="button" aria-label="Previous pattern">
          <span class="previous-icon"></span>
        </button>
        <button class="transport-button primary" id="play-button" type="button" aria-label="Play">
          <span class="play-icon" id="play-icon"></span>
          <span id="play-label">PLAY</span>
        </button>
        <button class="transport-button secondary" id="next-button" type="button" aria-label="Next pattern">
          <span class="next-icon"></span>
        </button>
        <button class="transport-button secondary stop-button" id="stop-button" type="button" aria-label="Stop playback" disabled>
          <span class="stop-icon"></span>
        </button>
      </div>

      <p class="hint" id="playback-hint">Tap play to start the audio engine.</p>
    </section>

    <section class="info-grid" aria-label="Playback information">
      <div class="info-card">
        <span class="info-label">ENGINE</span>
        <strong id="engine-state">Not started</strong>
      </div>
      <div class="info-card">
        <span class="info-label">OUTPUT</span>
        <strong id="output-state">Not connected</strong>
      </div>
      <div class="info-card">
        <span class="info-label">SESSION</span>
        <strong id="session-time">00:00</strong>
      </div>
    </section>

    <section class="diagnostics">
      <button class="diagnostics-toggle" id="diagnostics-toggle" type="button" aria-expanded="false">
        <span>DIAGNOSTICS</span><span class="chevron">⌄</span>
      </button>
      <div class="diagnostics-body" id="diagnostics-body" hidden>
        <div class="diagnostics-actions">
          <span class="diagnostics-note">Local playback log</span>
          <button class="text-button" id="copy-log" type="button">COPY LOG</button>
          <button class="text-button" id="clear-log" type="button">CLEAR</button>
        </div>
        <pre id="log" aria-live="polite">PulseForge ready.</pre>
      </div>
    </section>

    <footer>
      <span class="footer-left">BUILT FOR THE LONG RUN</span>
      <button id="build-refresh" class="build-stamp" type="button" aria-label="Force reload PulseForge from the server" title="Tap to clear the app cache and reload from the server">261110-0802</button>
      <span id="install-state" class="footer-right">WEB APP</span>
    </footer>
  </main>
  <audio id="media-output" playsinline></audio>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
